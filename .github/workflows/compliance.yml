name: Compliance

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
    branches:
      - '*'

concurrency:
  group: compliance-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  license-header:
    runs-on: ubuntu-24.04
    name: License Header Gate (SPDX)
    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Enforce SPDX headers on all tracked source files
        shell: bash
        run: |
          # Gate: every tracked source TU must carry
          # SPDX-License-Identifier: GPL-3.0-or-later (see ADR-001).
          # tools/nexus exits 1 when any file needs changes, 2 on error.
          mapfile -t FILES < <(git ls-files -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' \
            '*.h' '*.hh' '*.hpp' '*.hxx' '*.inl' \
            '*.py' '*.sh' '*.js')

          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "::error::No tracked source files found — license-header gate misconfigured"
            exit 2
          fi

          echo "Enforcing SPDX headers on ${#FILES[@]} tracked source files"
          python3 tools/nexus license-header enforce --dry-run "${FILES[@]}"

  proprietary-boundary:
    runs-on: ubuntu-24.04
    name: Proprietary Boundary Gate
    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Build Tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build binutils

      - name: Verify BUILD_PROPRIETARY Gate
        shell: bash
        run: |
          # Ensure the compliance script is executable
          chmod +x tools/check-proprietary-boundary.sh

          # Run the boundary check. The script:
          #   1. Greps GPL-core sources for forbidden include paths.
          #   2. Builds with BUILD_PROPRIETARY=OFF.
          #   3. Scans the resulting binary for proprietary symbols.
          #   4. Fails if any violation is found.
          bash tools/check-proprietary-boundary.sh

  test-violation:
    runs-on: ubuntu-24.04
    name: Test Violation Detection
    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Build Tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build binutils

      - name: Attempt illegal include
        shell: bash
        run: |
          # Simulate a PR that violates the boundary by patching a GPL core file
          # to include the proprietary header. The compliance script must catch
          # this and fail the job.
          echo '#include "source/util/util-dbscan.hpp"' >> source/plugin.cpp
          chmod +x tools/check-proprietary-boundary.sh
          if bash tools/check-proprietary-boundary.sh; then
            echo "::error::COMPLIANCE GATE FAILED TO DETECT VIOLATION"
            exit 1
          else
            echo "PASS: compliance gate correctly detected the violation"
          fi
