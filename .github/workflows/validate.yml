name: Validate Pull Request

on:
  pull_request:
    branches:
      - '*'

concurrency:
  group: validate-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Pull Request Validation"
    strategy:
      fail-fast: true
    runs-on: "ubuntu-22.04"
    steps:
    - name: "Clone"
      uses: actions/checkout@v3
      with:
        submodules: false
        fetch-depth: 0

    - name: "Copyright Headers"
      shell: bash
      run: |
        node "tools/copyright.js" .
        git --no-pager diff --patch --minimal HEAD --
        git update-index --refresh
        git diff-index --quiet HEAD --

  license-check:
    name: "License Compliance Check"
    runs-on: "ubuntu-22.04"
    steps:
    - name: "Clone"
      uses: actions/checkout@v3
      with:
        submodules: false
        fetch-depth: 0

    - name: "Verify Root LICENSE is GPLv3"
      shell: bash
      run: |
        if ! grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE; then
          echo "::error::Root LICENSE file does not contain GNU GPL text"
          exit 1
        fi
        if ! grep -q "version 3" LICENSE; then
          echo "::error::Root LICENSE is not GPLv3 — found without v3 clause"
          exit 1
        fi
        echo "Root LICENSE verified as GPL v3 (or later)"

    - name: "Verify SPDX Headers"
      shell: bash
      run: |
        missing=$(find source/ components/ -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.cc' -o -name '*.h' -o -name '*.cu' -o -name '*.cl' -o -name '*.glsl' -o -name '*.vert' -o -name '*.frag' -o -name '*.cmake' -o -name 'CMakeLists.txt' \) | while read f; do
          if ! grep -q "SPDX-License-Identifier: GPL-3.0-or-later" "$f"; then echo "$f"; fi
        done)
        if [ -n "$missing" ]; then
          echo "::error::The following files are missing the SPDX header"
          echo "$missing"
          exit 1
        fi
        echo "All source files have SPDX headers"

    - name: "Cross-Repository Contamination Scan (ADR-001 §4.1)"
      shell: bash
      run: |
        echo "Scanning for proprietary Nexus-commercial code contamination..."
        python3 tools/cross_repo_hash_scan.py \
          tools/cross_repo_scan_config.json \
          "${{ github.base_ref }}"

    - name: "PR Sign-Off Check (ADR-001 §4.2)"
      shell: bash
      run: |
        body="${{ github.event.pull_request.body }}"
        if ! echo "$body" | grep -qi "I certify that no proprietary Nexus source code was copied, merged, or vendored"; then
          echo "::error::PR must include sign-off: 'I certify that no proprietary Nexus source code was copied, merged, or vendored into this PR.' in the description."
          exit 1
        fi
        echo "PR sign-off verified (ADR-001 §4.2)"

  rt-safety:
    name: "RT-Safety Audit"
    runs-on: "ubuntu-22.04"
    steps:
    - name: "Clone"
      uses: actions/checkout@v3
      with:
        submodules: false
        fetch-depth: 0

    - name: "Run RT-Safety Audit"
      shell: bash
      run: |
        python3 tools/rt_safety_audit.py .
